<!doctype html>
<meta charset="utf-8">
<title>Misty Rainforest — Ambient Loop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #hint{position:fixed;left:0;right:0;bottom:8vh;text-align:center;
        font:400 15px/1.6 system-ui,sans-serif;color:#fff;opacity:.55;
        text-shadow:0 1px 8px #000;transition:opacity .8s;pointer-events:none}
  body.playing #hint{opacity:0}
  body.playing{cursor:none}
</style>

<video id="v" src="nature-loop.mp4" loop muted playsinline autoplay
       preload="auto" disablepictureinpicture></video>
<p id="hint">click anywhere for fullscreen &middot; press F</p>

<script>
  const v = document.getElementById('v');

  // Autoplay only survives while muted; unmuting is a user gesture away and the
  // loop is silent anyway, so we just keep it muted and looping forever.
  v.play().catch(() => {});

  function fullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  addEventListener('click', fullscreen);
  addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') fullscreen();
  });

  // Fade the hint out once playback is genuinely underway.
  v.addEventListener('playing', () => document.body.classList.add('playing'));

  // Some TV browsers drop the loop flag on long files; re-arm defensively.
  v.addEventListener('ended', () => { v.currentTime = 0; v.play(); });
</script>
